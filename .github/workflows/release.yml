name: Publish SpinPlot release after Pages deploy
on:
  workflow_run:
    workflows: ["Deploy SpinPlot to GitHub Pages"]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_VERSION="$(git show "${RELEASE_SHA}^:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")"
          if [ "${VERSION}" = "${PREVIOUS_VERSION}" ]; then
            echo "Application version unchanged (${VERSION}); no release tag required."
            exit 0
          fi
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            exit 0
          fi
          NOTES="$(awk -v version="${VERSION}" '
            index($0, "## " version) == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)"
          test -n "${NOTES}"
          gh release create "${TAG}" --title "SpinPlot ${VERSION}" --notes "${NOTES}" --target "${RELEASE_SHA}"
