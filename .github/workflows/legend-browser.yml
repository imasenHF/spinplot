name: SpinPlot legend controls browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/main.js'
      - 'src/interface.js'
      - 'src/plotting/**'
      - 'scripts/legend-browser-smoke.mjs'
      - '.github/workflows/legend-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Browser check: global and subplot legend settings
        run: node scripts/legend-browser-smoke.mjs
