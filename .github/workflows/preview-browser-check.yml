name: SpinPlot live preview browser smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - name: Test published temporary webpage
        env:
          SPINPLOT_TEST_COLORBAR_DBLCLICK: '1'
          SPINPLOT_TEST_FREQUENCY_ALIGNMENT: '1'
          SPINPLOT_TEST_TWOD_VIEW_MODES: '1'
          SPINPLOT_TEST_MANUAL_CURVE_HEATMAP: '1'
          SPINPLOT_TEST_HEATMAP_DATA_PANEL: '1'
          SPINPLOT_TEST_ADJACENT_SYMBOL_COLUMN: '1'
          SPINPLOT_TEST_SURFACE_CONTOUR: '1'
          SPINPLOT_TEST_AXIS_LOG: '1'
          SPINPLOT_TEST_AXIS_DISPLAY: '1'
          SPINPLOT_TEST_POWER_SATURATION: '1'
          SPINPLOT_TEST_FOOTPRINT: '1'
        run: node scripts/preview-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinplot-browser-preview-screenshots
          path: browser-preview/
          retention-days: 14
          if-no-files-found: warn
