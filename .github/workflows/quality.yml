name: SpinPlot quality checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint, format, unit tests and production build
        run: npm run check
      - name: Install Playwright browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Browser interaction regression
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinplot-browser-regression
          path: browser-preview/
          retention-days: 14
          if-no-files-found: warn
